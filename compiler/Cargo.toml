[package]
name = "bmb"
version = "0.2.0"
edition = "2024"
description = "BMB v2 compiler"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "bmb"
path = "src/main.rs"

# The stage0 side of the differential case `smt-terms` (tests/port/README.md).
[[example]]
name = "smt_terms_ref"
path = "../tests/port/smt_terms_ref.rs"

# The stage0 side of the differential cases `smt-answers*` (tests/port/README.md).
[[example]]
name = "smt_answers_ref"
path = "../tests/port/smt_answers_ref.rs"

# The stage0 side of the differential cases `tree-*`, `udiff*`, `compact*` and `plan*` (tests/port/README.md).
[[example]]
name = "edit_ref"
path = "../tests/port/edit_ref.rs"

