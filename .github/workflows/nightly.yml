name: nightly

# Long fuzzing runs (backlog INF-07). Each run uses new seeds (the run number),
# so the nightly runs together cover far more inputs than the per-push gate.
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Pinned tools (z3, LLVM)
        run: sudo ./scripts/setup.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Front-end fuzzing
        env:
          BMB_FUZZ_ITERS: "100000"
          BMB_FUZZ_SEED: ${{ github.run_number }}
        run: cargo test --release --test fuzz -- --nocapture
      - name: Normal form and MCP session fuzzing
        env:
          BMB_FMT_FUZZ_ITERS: "5000"
          BMB_FMT_FUZZ_PROVE: "40"
          BMB_FMT_FUZZ_SEED: ${{ github.run_number }}
          BMB_MCP_FUZZ_SESSIONS: "1000"
          BMB_MCP_FUZZ_CALLS: "200"
          BMB_MCP_FUZZ_SEED: ${{ github.run_number }}
        run: cargo test --release --test fmt_fuzz --test mcp_fuzz -- --nocapture
      - name: Soundness fuzzing
        env:
          BMB_SOUND_ITERS: "200"
          BMB_SOUND_SEED: ${{ github.run_number }}000
        run: cargo test --release --test soundness --test soundness_loops --test soundness_calls --test soundness_rec --test soundness_unsigned --test soundness_specs -- --nocapture
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: /tmp/bmb-fuzz-crash.bmb
          if-no-files-found: ignore

  # Performance regression (backlog INF-12): BMB against safe Rust on the
  # baseline benches; fails when a ratio exceeds G6's +5%. Build times
  # (INF-13, ADR-0041 accepted costs) are only recorded. Both results are kept
  # as artifacts.
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Pinned tools (z3, LLVM)
        run: sudo ./scripts/setup.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Build times (recorded, never a failure)
        run: |
          cargo build --release --quiet
          mkdir -p perf
          python3 scripts/build_time.py --defs 1000 --out perf/build-time.jsonl
      - name: BMB against safe Rust (fails above 1.05)
        run: python3 bench/baseline/run.py --runs 15 --out perf/baseline.md --max-ratio 1.05
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-${{ github.run_number }}
          path: perf/
          if-no-files-found: ignore
