name: nightly

# Long fuzzing runs, and the differential cases of the port too long for the
# per-push gate. Each fuzzing run uses new seeds (the run number), so the
# nightly runs together cover far more inputs than the per-push gate.
on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Pinned tools (z3, LLVM)
        run: sudo ./scripts/setup.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Front-end fuzzing
        env:
          BMB_FUZZ_ITERS: "100000"
          BMB_FUZZ_SEED: ${{ github.run_number }}
        run: cargo test --release --test fuzz -- --nocapture
      - name: Normal form and MCP session fuzzing
        env:
          BMB_FMT_FUZZ_ITERS: "5000"
          BMB_FMT_FUZZ_PROVE: "40"
          BMB_FMT_FUZZ_SEED: ${{ github.run_number }}
          BMB_MCP_FUZZ_SESSIONS: "1000"
          BMB_MCP_FUZZ_CALLS: "200"
          BMB_MCP_FUZZ_SEED: ${{ github.run_number }}
        run: cargo test --release --test fmt_fuzz --test mcp_fuzz -- --nocapture
      - name: Soundness fuzzing
        env:
          BMB_SOUND_ITERS: "200"
          BMB_SOUND_SEED: ${{ github.run_number }}000
        run: cargo test --release --test soundness --test soundness_loops --test soundness_calls --test soundness_rec --test soundness_unsigned --test soundness_specs --test soundness_data --test soundness_vec -- --nocapture
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash
          path: /tmp/bmb-fuzz-crash.bmb
          if-no-files-found: ignore

  # The port's differential cases too long for the per-push gate
  # (scripts/port_nightly.sh, tests/port/nightly/cases.json), as one job per
  # part, each on a runner of its own: the parts are balanced by the cases'
  # recorded seconds (tests/port/nightly/costs.json) and every case is in
  # exactly one (scripts/test_gate_scripts.py). Each job builds the
  # optimized compiler, proves the port and builds what its cases compare.
  port:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Pinned tools (z3, LLVM)
        run: sudo ./scripts/setup.sh
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Differential cases, part ${{ matrix.part }} of 3
        run: scripts/port_nightly.sh --shard ${{ matrix.part }}/3
      - name: Keep the differences
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: port-differences-${{ matrix.part }}
          path: |
            target/nightly.jsonl
            target/nightly-excerpts
            target/nightly-build/*.error
          if-no-files-found: ignore
